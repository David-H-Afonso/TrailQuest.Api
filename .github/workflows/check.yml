name: Verify API
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Test image scanner wrapper
        run: bash scripts/test-scan-image.sh
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with: {global-json-file: global.json}
      - run: bash scripts/check.sh
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project TrailQuest.Api.csproj
      - run: dotnet list TrailQuest.Api.sln package --vulnerable --include-transitive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: api-verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
