name: Build & Push API image
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Prepare image tags
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'VERSION must contain a numeric major.minor.patch release.' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trailquest-api"
          tags=("$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo 'The release tag must equal v followed by VERSION.' >&2
              exit 1
            fi
            tags+=("$image:$version" "$image:v$version")
          else
            if [[ "$GITHUB_REF_NAME" != main && "$GITHUB_REF_NAME" != master ]]; then
              echo 'Branch publication is limited to main and master.' >&2
              exit 1
            fi
            tags+=("$image:$GITHUB_REF_NAME")
            if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              tags+=("$image:latest")
            fi
          fi
          {
            printf 'version=%s\nimage=%s\n' "$version" "$image"
            echo 'tags<<TRAILQUEST_IMAGE_TAGS'
            printf '%s\n' "${tags[@]}"
            echo TRAILQUEST_IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite an existing release version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/ensure-new-image-tag.sh trailquest-api "$VERSION"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Use the ephemeral runner's network/resolver, not a nested Docker bridge.
          driver-opts: network=host
      - name: Resolve Ubuntu IPv4 mirrors on the runner
        id: ubuntu
        run: |
          set -euo pipefail
          hosts="$(bash scripts/resolve-build-hosts.sh)"
          {
            echo 'hosts<<TRAILQUEST_UBUNTU_HOSTS'
            printf '%s\n' "$hosts"
            echo TRAILQUEST_UBUNTU_HOSTS
          } >> "$GITHUB_OUTPUT"
      - name: Build local candidate before publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          add-hosts: ${{ steps.ubuntu.outputs.hosts }}
          provenance: false
          tags: trailquest-api:release-check
          build-args: |
            RELEASE_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=trailquest-api
          cache-to: type=gha,mode=max,scope=trailquest-api
      - name: Block vulnerable or secret-bearing candidate
        run: bash scripts/scan-image.sh trailquest-api:release-check
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          add-hosts: ${{ steps.ubuntu.outputs.hosts }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=trailquest-api
          provenance: true
          sbom: true
      - name: Record image tags and pull command
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            printf '### TrailQuest API\n\nSource: `%s`\n\nPublished tags:\n' "$GITHUB_SHA"
            while IFS= read -r tag; do printf -- '- `%s`\n' "$tag"; done <<< "$IMAGE_TAGS"
            printf '\nPinned pull command:\n```sh\ndocker pull %s@%s\n```\n' "$IMAGE" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: api-image-security-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
